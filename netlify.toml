# Конфигурация деплоя статической демо-версии диалогового окна и
# дашборда Индекса уязвимости на Netlify.
#
# Сайт полностью статический (HTML/CSS/JS, без сборки) — данные
# (методика, реестр, демо-источники) предварительно экспортированы в
# JSON скриптом `scripts/export_static_data.py` и закоммичены в
# `netlify-site/data/`, поэтому Netlify не нужно устанавливать Python
# или запускать какие-либо build-команды.

[build]
  publish = "netlify-site"
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
